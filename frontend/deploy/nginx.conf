# nginx in front of BillingRecon (ADR 0045, docs/runbook.md section 11): it ends TLS, serves the app, and passes /api to
# the API, which believes its X-Forwarded-For and X-Forwarded-Proto because this container is its known proxy.

server_tokens off;

# Plain HTTP only sends the browser to HTTPS; the API itself refuses plain HTTP outside Development (ADR 0035).
server {
    listen 80;
    server_name _;

    # Let's Encrypt's challenge, which certbot answers through this folder in production (ADR 0055).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # The API answers with its own headers (no-store and its policy on /api, ADR 0035).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # The app's own pages and files (docs/security.md section 10, rows S5 and E6): a content security policy that admits
    # the inline theme script by its SHA-256 alone, no framing, no sniffing, HTTPS for a year. A nested location would drop
    # these, so the files under /assets/ repeat them.
    set $csp "default-src 'self'; script-src 'self' 'sha256-EiUJJFQJQCBNqB/aazghpxtqLJ7StNqlkar3PJPRG+g='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
