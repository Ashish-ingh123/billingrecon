<svg xmlns="http://www.w3.org/2000/svg" viewBox="-57 -65 141 130" role="img" aria-labelledby="ashline-logo-title">
  <!--
    The mark of ashline, the company behind BillingRecon: a hexagon holding an A whose crossbar runs out to a dot.
    Copied on 2026-11-24 from the inline SVG in the header of the company's site (https://ashish-singh-ai-studio.vercel.app/),
    path for path, with the colours of its light theme. On a dark ground the site draws the dot in #c4a1ff; nothing else
    changes. It is used as it is and never redrawn (docs/build-prompts.md, Phase 9).
  -->
  <title id="ashline-logo-title">ashline</title>
  <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="10" stroke-linejoin="round" />
  <path d="M-26 30 L0 -32 L26 30" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="-14" y1="10" x2="57.5" y2="10" stroke="#ffffff" stroke-width="8" stroke-linecap="butt" />
  <circle cx="76" cy="10" r="8" fill="#1a1033" />
</svg>
