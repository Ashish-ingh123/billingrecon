# Local run of BillingRecon (ADR 0045): SQL Server 2022 (Developer edition) and Seq; the migration step, the API and the
# frontend behind nginx with TLS; and, when DEMO_ENABLED=true in .env, the demo hospital with a week of bills and payments.
# `docker compose up --build` starts it all; the app is then at https://localhost (docs/runbook.md section 13).
#
# The sql and seq services were written on a machine without Docker. Image tags, variables, ports and healthcheck
# commands were checked against the vendors' documentation and image metadata on 2026-10-03; the owner first started
# the containers on 2026-10-17. The results of "Verify on a Docker machine" in docs/runbook.md are still to be recorded
# there. The services of Prompt 8.1 first ran on the owner's machine on 2026-11-24, after two fixes to the images
# (ADR 0045 built note); what that run did not check is in runbook section 8, row 8.1.
#
# Before the first start, copy .env.example to .env and fill it in. No secret and no licence acceptance lives in
# this file; both come from .env, which git ignores.

name: billingrecon

services:
  sql:
    # A pinned cumulative update (the same image as 2022-latest on 2026-10-03). Bump it deliberately, and keep the
    # Testcontainers tests on the same tag. The image is x86-64 only.
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    container_name: billingrecon-sql
    # SQL Server on Linux documents a 15-character limit for the host name.
    hostname: billrecon-sql
    restart: unless-stopped
    environment:
      # Accepting the licence is each developer's own decision, so it is read from .env and never committed.
      ACCEPT_EULA: "${MSSQL_ACCEPT_EULA:?Set MSSQL_ACCEPT_EULA=Y in .env to accept the SQL Server licence terms}"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env, see .env.example}"
    ports:
      # Loopback only: the database is for this machine, not for the network.
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # $$ stops Compose from substituting the variable; the container's shell reads it from its own environment.
      # -C trusts the container's self-signed certificate; -b makes a failed query exit with a non-zero code.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  seq:
    # Pinned to a minor version; it receives 2026.1.x patch builds only.
    image: datalust/seq:2026.1
    container_name: billingrecon-seq
    restart: unless-stopped
    environment:
      # Must be exactly Y. Read from .env for the same reason as above.
      ACCEPT_EULA: "${SEQ_ACCEPT_EULA:?Set SEQ_ACCEPT_EULA=Y in .env to accept the Seq licence terms}"
      # Local development only: no login and no API key. Seq refuses to initialise a new instance without either a
      # password or this opt-out. It is read on the first start only (empty seq-data volume).
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      # Container port 80 serves the UI, the API and ingestion, so http://localhost:5341 works for the browser and
      # for the API's Seq sink. Loopback only, because authentication is off.
      - "127.0.0.1:${SEQ_HOST_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    healthcheck:
      # seqcli ships in the image; `node health` exits 0 only when Seq's /health endpoint answers 2xx.
      test: ["CMD-SHELL", "/seqsvr/Client/seqcli node health -s http://localhost || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 15s

  # The database, its logins and every migration, as docs/runbook.md section 10 does it by hand; runs, then stops.
  migrate:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env, see .env.example}"
      MIGRATOR_PASSWORD: "${BILLINGRECON_MIGRATOR_PASSWORD:?Set BILLINGRECON_MIGRATOR_PASSWORD in .env, see .env.example}"
      APP_PASSWORD: "${BILLINGRECON_APP_PASSWORD:?Set BILLINGRECON_APP_PASSWORD in .env, see .env.example}"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  # The API outside Development: it never migrates, connects as billingrecon_app, refuses plain HTTP and believes the
  # forwarded headers of the frontend container alone (ADR 0035). Not published: it is reached through nginx.
  api:
    build:
      context: .
      dockerfile: src/BillingRecon.Api/Dockerfile
    container_name: billingrecon-api
    restart: unless-stopped
    environment:
      # Demo: Production in all but the name, the one environment besides Development where the demo may run (ADR 0052).
      # Production for the operator's tenant commands, which the Demo environment refuses: API_ENVIRONMENT in .env.
      ASPNETCORE_ENVIRONMENT: "${API_ENVIRONMENT:-Demo}"
      Database__ConnectionString: "Server=sql;Database=BillingRecon;User Id=billingrecon_app;Password=${BILLINGRECON_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env, see .env.example}"
      # The key that keeps the secrets of the second step of a sign-in unreadable at rest (ADR 0061), and whether an
      # administrator and a supervisor must have one: false is allowed in the Demo environment only, so the demo's users
      # sign in with their password alone. Set TWO_STEP_REQUIRED=true with API_ENVIRONMENT=Production.
      TwoStep__EncryptionKey: "${TWO_STEP_ENCRYPTION_KEY:?Set TWO_STEP_ENCRYPTION_KEY in .env, see .env.example}"
      TwoStep__Required: "${TWO_STEP_REQUIRED:-false}"
      # The mail server of a forgotten password (ADR 0061, amended): optional, and with no host no mail is sent.
      Mail__Host: "${MAIL_HOST:-}"
      Mail__Port: "${MAIL_PORT:-587}"
      Mail__User: "${MAIL_USER:-}"
      Mail__Password: "${MAIL_PASSWORD:-}"
      Mail__From: "${MAIL_FROM:-}"
      Mail__PublicBaseUrl: "${MAIL_PUBLIC_BASE_URL:-}"
      AllowedHosts: "localhost;frontend"
      ReverseProxy__KnownProxies__0: "172.28.0.10"
      Seq__ServerUrl: "http://seq"
      Demo__Enabled: "${DEMO_ENABLED:-false}"
      Demo__AdminPassword: "${DEMO_PASSWORD:-}"
      # For a load test only (ADR 0046): answers say how long their number series was waited for and held.
      Diagnostics__ServerTiming: "${SERVER_TIMING:-false}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seq:
        condition: service_healthy

  # nginx: the app's files with their own headers, TLS with a local certificate made on the first start, /api passed to
  # the API. Its fixed address is the API's one known proxy.
  frontend:
    build:
      context: frontend
      args:
        # "Contact support" on the sign-in page (ADR 0047); empty leaves the link out.
        VITE_SUPPORT_EMAIL: "${SUPPORT_EMAIL:-}"
    container_name: billingrecon-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTPS_HOST_PORT:-443}:443"
      - "127.0.0.1:${HTTP_HOST_PORT:-80}:80"
    volumes:
      - certs:/etc/nginx/certs
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy

  # The demo (ADR 0045 point 1), when DEMO_ENABLED=true: four more users, the catalogue, patients and payers, and a
  # week of bills and payments, all entered through the API as its users would. Does nothing the second time.
  demo-seed:
    image: node:24-alpine
    environment:
      DEMO_ENABLED: "${DEMO_ENABLED:-false}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
      BASE_URL: "https://frontend"
      NODE_EXTRA_CA_CERTS: "/certs/tls.crt"
    volumes:
      - ./deploy/demo:/demo:ro
      - certs:/certs:ro
    command: ["node", "/demo/seed.mjs"]
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"

  # The load test of Prompt 8.2 (ADR 0046, docs/runbook.md section 14), never started by `up`: only by
  # `docker compose --profile load run --rm load`. Signs in as the demo administrator, so DEMO_ENABLED=true; for the
  # number-series timings start the API with SERVER_TIMING=true. It leaves its users, patients and bills in the demo.
  load:
    profiles: ["load"]
    image: node:24-alpine
    environment:
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
      BASE_URL: "https://frontend"
      NODE_EXTRA_CA_CERTS: "/certs/tls.crt"
      LOAD_USERS: "${LOAD_USERS:-50}"
      LOAD_FILL_BILLS: "${LOAD_FILL_BILLS:-10000}"
      LOAD_SECONDS: "${LOAD_SECONDS:-120}"
      LOAD_THINK_MS: "${LOAD_THINK_MS:-1000}"
      LOAD_STRESS_SECONDS: "${LOAD_STRESS_SECONDS:-60}"
    volumes:
      - ./deploy/load:/load:ro
      - certs:/certs:ro
    command: ["node", "/load/load.mjs"]
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"

# Named volumes keep the data across `docker compose down`. `docker compose down -v` deletes BOTH of them.
volumes:
  sql-data:
  seq-data:
  # The local certificate of nginx, made on the first start.
  certs:

# A fixed range, so that the API can name its proxy by address.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
