# Dependabot (ADR 0017): weekly pull requests for NuGet packages and for the GitHub Actions the workflow uses.
# Central package management (Directory.Packages.props) is understood. The framework-bound packages follow the
# target framework (ADR 0014), so their major versions are a deliberate decision, not a Dependabot pull request.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata

  # The frontend (Prompt 7.1, ADR 0038). A release is proposed a week after it is published, not the day it appears:
  # time for a bad release to be found and pulled. ESLint stays on 9 until eslint-plugin-jsx-a11y supports 10, and
  # TypeScript on 5 until typescript-eslint and openapi-typescript accept a later one (ADR 0038, point 1 and 10).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
